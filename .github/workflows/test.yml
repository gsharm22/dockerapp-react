name: Test and publish Docker image

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PATH: frontend
  IMAGE_NAME: docker-react
  ACR_SERVER: ${{ vars.ACR_NAME }}.azurecr.io

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test image
        working-directory: ${{ env.APP_PATH }}
        run: docker build -t docker-react-test -f Dockerfile.dev .

      - name: Run tests
        run: |
          docker run --rm \
            -e CI=true \
            docker-react-test \
            npm run test -- --coverage

  publish:
    name: Publish image to ACR
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" |
            docker login "${ACR_SERVER}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password-stdin

      - name: Build production image
        working-directory: ${{ env.APP_PATH }}
        run: |
          docker build \
            -f Dockerfile \
            -t "${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${ACR_SERVER}/${IMAGE_NAME}:latest" \
            .

      - name: Push production image
        run: |
          docker push "${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${ACR_SERVER}/${IMAGE_NAME}:latest"

      - name: Sign out from ACR
        if: always()
        run: docker logout "${ACR_SERVER}"
