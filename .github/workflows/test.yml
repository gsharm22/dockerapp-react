name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test image
        working-directory: frontend
        run: docker build -t gsharm22/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: |
          docker run --rm \
            -e CI=true \
            gsharm22/docker-react \
            npm run test -- --coverage
  publish:
    name: Publish image to ACR
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sign in to ACR
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" |
            docker login "${ACR_SERVER}" \
              --username "${{ secrets.ACR_USERNAME }}" \
              --password-stdin

      - name: Build production image
        working-directory: frontend
        run: |
          docker build \
            -f Dockerfile \
            -t "${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}" \
            -t "${ACR_SERVER}/${IMAGE_NAME}:latest" \
            .

      - name: Push production image
        run: |
          docker push "${ACR_SERVER}/${IMAGE_NAME}:${GITHUB_SHA}"
          docker push "${ACR_SERVER}/${IMAGE_NAME}:latest"

      - name: Sign out from ACR
        if: always()
        run: docker logout "${ACR_SERVER}"
