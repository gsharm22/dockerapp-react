name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build test image
        run: docker build -t gsharm22/docker-react -f Dockerfile.dev .

      - name: Run tests
        run: |
          docker run --rm \
            -e CI=true \
            gsharm22/docker-react \
            npm run test -- --coverage
